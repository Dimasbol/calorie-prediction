# Main task: image + ingredient names. No portion mass as an input.
data_dir: data
run_dir: artifacts/main
seed: 42
val_fraction: 0.20
image_model: resnet18.a1_in1k
text_model: distilbert/distilbert-base-uncased
pretrained: true
image_size: 224
max_length: 128
projection_dim: 256
dropout: 0.20
use_mass: false
image_trainable: all
text_trainable_layers: 2
freeze_batchnorm: true
batch_size: 4
accumulation_steps: 4
num_workers: 0
epochs: 25
warmup_epochs: 2
patience: 6
image_lr: 0.0001
text_lr: 0.00002
head_lr: 0.001
weight_decay: 0.0001
grad_clip: 1.0
amp: true
device: cuda
deterministic: true
log_every: 100
